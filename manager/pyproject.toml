[project]
name = "safe-agents-manager"
version = "0.1.0"
description = "Headless manager that installs and runs LangGraph agents for Safe-Agents Desktop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "platformdirs>=4.2,<5",
]

[project.scripts]
safe-agents-manager = "safe_agents_manager.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safe_agents_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs network, uv and a real langgraph server (opt-in with -m integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
