name: release

# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # .msi and NSIS .exe
          - os: macos-latest # Apple Silicon .dmg
          - os: ubuntu-22.04 # .deb, .AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # PyInstaller cannot cross-compile, so every OS builds its own manager executable.
      - name: Build the manager sidecar and fetch uv
        run: uv run --project manager python manager/scripts/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # Code signing: without it Windows SmartScreen and macOS Gatekeeper warn on first run.
      # Add the certificate secrets described in desktop/README.md before a public release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Safe Agents ${{ github.ref_name }}
          releaseBody: See the assets below to download and install.
          releaseDraft: true
